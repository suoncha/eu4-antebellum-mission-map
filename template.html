<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ Mission Map</title>
<script>try { const t = localStorage.getItem('aba-mission-map-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without blocking the page: text shows in a fallback font until they arrive -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" onload="this.onload = null; this.rel = 'stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<style>
/* Layout: full-height map table; header strip on top; ledger panel docked right (bottom sheet on phones);
   map modes float top-centre over the map, bookmark shields bottom-centre, like the game's start screen */
:root {
  --bg: #e7e9e4; --panel: #f6f7f3; --ink: #1f2522; --muted: #5d6762; --line: #c6cbc3;
  --accent: #8a5a12; --chip: #e2e5de; --card: #ffffff;
  --sea: #a9bfc9; --land: #d4d5d1; --waste: #9b9a94; --nohist: #e9e3d3; --border: #2a2f2c;
  --f-display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a19; --panel: #1e2321; --ink: #e5e8e3; --muted: #9aa49e; --line: #353c39;
  --accent: #e0a94c; --chip: #2a302d; --card: #262c29;
  --sea: #24343c; --land: #3b3d3c; --waste: #2b2b29; --nohist: #4a463c; --border: #0c0e0d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a19; --panel: #1e2321; --ink: #e5e8e3; --muted: #9aa49e; --line: #353c39;
  --accent: #e0a94c; --chip: #2a302d; --card: #262c29;
  --sea: #24343c; --land: #3b3d3c; --waste: #2b2b29; --nohist: #4a463c; --border: #0c0e0d; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: .01em; line-height: 1.1; }
.sub { color: var(--muted); font-size: .85rem; }
.titlerow { display: flex; align-items: center; gap: 6px; }
.titlerow h1 { margin-right: 4px; }
.ibtn { width: 32px; height: 32px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line);
  border-radius: 50%; background: var(--panel); color: var(--ink); cursor: pointer; }
.ibtn:hover { background: var(--chip); }
.ibtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); margin-left: auto; align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; vertical-align: -3px; margin-right: 5px; border: 1px solid var(--border); }
.sw.ded { background: #b5562f; }
.sw.add { background: repeating-linear-gradient(45deg, #b5562f 0 3px, var(--land) 3px 6px); }
.sw.none { background: var(--land); }
.sw.multi { background: linear-gradient(90deg, #c9a227 0 33%, #4f7cac 33% 66%, #8c4f8f 66%); }
.main { flex: 1; display: flex; min-height: 0; position: relative; }
.mapwrap { flex: 1; position: relative; min-width: 0; overflow: hidden; background: var(--bg); touch-action: none; cursor: grab; }
.mapwrap.drag { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
button { font-family: var(--f-body); }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .row:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* map modes */
.modes { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px; gap: 2px; box-shadow: 0 2px 8px rgb(0 0 0 / .15); max-width: calc(100% - 100px); overflow-x: auto; }
.modes button { border: 0; background: transparent; color: var(--ink); font-weight: 600; font-size: .85rem; padding: 6px 12px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.modes button:hover { background: var(--chip); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button, .btn { font: 600 1rem var(--f-body); width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 3px; cursor: pointer; }
.btn { width: auto; height: auto; padding: 4px 10px; font-size: .85rem; }
.hint { position: absolute; left: 10px; top: 10px; max-width: 220px; font-size: .74rem; line-height: 1.45; color: var(--muted);
  background: var(--panel); padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; }
.hover { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; font-size: .8rem; border-radius: 3px; white-space: nowrap; z-index: 3; }

/* bookmark shields */
/* at most 7 shields wide; more scroll sideways (--sw = shield width) */
.shields { --sw: 64px; position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 10px;
  max-width: min(calc(7 * var(--sw) + 6 * 10px + 12px), calc(100% - 20px)); overflow-x: auto; padding: 4px 6px 8px;
  scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
.shields::-webkit-scrollbar { height: 6px; }
.shields::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
.shield { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; width: var(--sw); flex: none; color: var(--ink); scroll-snap-align: start; }
/* same shape as the detail header's flag, drawn on the flag itself so it fills the shield */
.shield .flag { border-width: 2px; border-radius: 4px 4px 50% 50% / 4px 4px 55% 55%; box-shadow: 0 2px 6px rgb(0 0 0 / .35); transition: transform .12s; }
.shield:hover .flag, .shield:focus-visible .flag { transform: translateY(-3px); }
.shield.on .flag { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgb(0 0 0 / .35); }
.shield .nm { font-size: .72rem; font-weight: 600; background: var(--panel); padding: 0 5px; border-radius: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* side panel */
aside { width: 440px; max-width: 100%; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
.ph { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.ph input { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; }
.pb { overflow-y: auto; padding: 12px 14px 24px; flex: 1; min-height: 0; }
h2 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; text-wrap: balance; line-height: 1.15; }
.grp { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 4px; font-weight: 600; }
.tagcode { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { background: var(--chip); border-radius: 2px; padding: 1px 6px; font-size: .78rem; font-variant-numeric: tabular-nums; }
.chip.d { background: var(--accent); color: var(--panel); font-weight: 600; }
details { border-bottom: 1px solid var(--line); }
details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 2px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .12s; flex: none; }
details[open] > summary::before { transform: rotate(90deg); }
details > summary .cnt { margin-left: auto; font-family: var(--f-mono); letter-spacing: 0; }
details > .body { padding: 0 0 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 3px; cursor: pointer; }
.row:hover { background: var(--chip); }
.row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flag { display: inline-block; flex: none; background-repeat: no-repeat; border: 1px solid var(--border); border-radius: 2px; }
.ricon { display: inline-block; flex: none; background-repeat: no-repeat; }
.empty { color: var(--muted); font-size: .88rem; margin: 4px 0 8px; }
textarea { width: 100%; box-sizing: border-box; font: .85rem/1.4 var(--f-mono); padding: 6px 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; resize: vertical; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; align-items: center; }
.tools .note { font-size: .78rem; color: var(--muted); }

/* country detail */
.dhead { display: flex; gap: 12px; align-items: center; }
.dhead .flag { width: 56px; height: 56px; border-radius: 4px 4px 50% 50% / 4px 4px 55% 55%; border-width: 2px; }
.dname { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lore { white-space: pre-line; line-height: 1.5; font-size: .92rem; max-width: 65ch; margin: 0; }
.src { font-size: .78rem; color: var(--muted); margin: 0 0 8px; }

/* mission tree preview */
.tree { overflow-x: auto; padding-bottom: 6px; }
/* EU4-like: one column per slot, rows by position; the row gap leaves room for the arrows */
.tgrid { position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(74px, 1fr)); gap: 24px 8px; min-width: calc(var(--cols) * 80px); }
.tgrid .arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; color: var(--muted); }
.tgrid .arrows path.a { fill: none; stroke: currentColor; stroke-width: 1.5; }
.tabs { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; min-height: 22px; }
.tabs button { font: 600 .7rem var(--f-mono); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 2px; padding: 0 5px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.forms { margin: 0 0 8px; gap: 4px; }
.forms button { display: inline-flex; align-items: center; gap: 5px; font: 600 .78rem var(--f-body); padding: 3px 8px; }
.forms .flag { flex: none; }
.card { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 5px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: default; min-width: 0; }
.card .mi { width: 40px; height: 40px; border-radius: 3px; background-color: var(--chip); background-repeat: no-repeat; flex: none; }
.card .mt { font-size: .72rem; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.cur { background: var(--chip); }
.tip { position: fixed; z-index: 20; max-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: .82rem; line-height: 1.4; box-shadow: 0 4px 14px rgb(0 0 0 / .25); pointer-events: none; white-space: pre-line; }
.tip b { display: block; font-size: .88rem; margin-bottom: 2px; }
.tip .r { color: var(--muted); font-size: .76rem; margin-top: 4px; }

@media (max-width: 760px) {
  .main { flex-direction: column; }
  aside { width: 100%; height: 48%; border-left: 0; border-top: 1px solid var(--line); }
  .legend { margin-left: 0; }
  .hint { display: none; }
  .modes { top: 6px; max-width: calc(100% - 60px); left: 8px; transform: none; }
  .shields { --sw: 54px; } .shield .flag { zoom: .8; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="titlerow">
        <h1>__TITLE__</h1>
        <button class="ibtn" id="theme" type="button"></button>
        <button class="ibtn" id="music" type="button" hidden></button>
      </div>
      <div class="sub">__SUBTITLE__</div>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map"></canvas>
      <div class="modes" id="modes" role="toolbar" aria-label="Map mode"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div class="hint" id="hint"></div>
      <div class="shields" id="shields" aria-label="Suggested countries"></div>
      <div class="hover" id="hover" hidden></div>
    </div>
    <aside>
      <div class="ph">
        <input id="q" type="search" placeholder="Search tag or country" aria-label="Search">
        <button class="btn" id="back" hidden>Back</button>
      </div>
      <div class="pb" id="panel"></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script type="module">
// The page's data: text (names, missions, lore, ...) as gzipped JSON, images and music as base64.
// fetch() decodes data: URLs natively, and DecompressionStream unzips, so neither blocks the page for long.
const BINARY = /*__BINARY__*/null;
const unpack = async (b64, type) => (await fetch(`data:${type};base64,${b64}`)).blob();
const D = JSON.parse(await new Response((await unpack('/*__DATA__*/', 'application/octet-stream')).stream()
  .pipeThrough(new DecompressionStream('gzip'))).text());
// missions come compact from the build: [index, icon, position, [required indexes], title, description]
for (const s of D.series) s.missions = s.missions.map(([id, icon, pos, req, title, desc]) =>
  ({ id: String(id), icon, pos, req: req.map(String), title, desc }));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');

// ---------------------------------------------------------------- modes
// The first mode listed is the default; keys 1, 2, ... in this order. The Actum mode is there when
// ACTUM_MODE is on in build_map.py.
const MODES = [
  ...(D.actum ? [{ id: 'actum', label: 'Actum' }] : []),
  { id: 'ante-bellum', label: 'Ante Bellum' },
  { id: 'religion', label: 'Religion' },
  { id: 'culture', label: 'Culture' },
].map((m, i) => ({ ...m, key: String(i + 1) }));
const hasMode = id => MODES.some(m => m.id === id);
let mode = MODES[0].id;

// ---------------------------------------------------------------- tag sets
const KEY = 'aba-mission-map-dedicated';
let DED = new Set(D.dedicated);
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (Array.isArray(s)) DED = new Set(s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...DED])); } catch (e) {} };
const ADD = new Set(D.additional);
const ABT = new Set(D.abTree);
const parseTags = s => s.toUpperCase().split(/[\s,;]+/).filter(Boolean);
const actumState = t => DED.has(t) ? 2 : ADD.has(t) ? 1 : 0;

// ---------------------------------------------------------------- colours
function hashColor(t) { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return [80 + h % 150, 80 + (h >> 8) % 150, 80 + (h >> 16) % 150]; }
const tagCol = t => (D.tags[t] && D.tags[t].color) || hashColor(t);
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function tokenRGB(name) {
  const el = document.createElement('i'); el.style.color = `var(${name})`; document.body.appendChild(el);
  const m = getComputedStyle(el).color.match(/\d+/g).map(Number); el.remove(); return m.slice(0, 3);
}
const mix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] * (1 - t) + b[i] * t));
// greyed-out tag: keep a hint of its lightness so neighbours stay distinguishable
const grey = (c, land) => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return mix([l, l, l], land, 0.72); };

// ---------------------------------------------------------------- sprites
function sprite(sheet, i, size, cls, extra = '') {
  const s = D[sheet]; if (!s.uri || i == null || i < 0) return null;
  const c = s.cols, x = (i % c) * size, y = Math.floor(i / c) * size;
  return `<span class="${cls}" style="width:${size}px;height:${size}px;background-image:var(--${sheet});background-size:${c * size}px auto;background-position:-${x}px -${y}px;${extra}" aria-hidden="true"></span>`;
}
// The sheets become blob: URLs: a data URI in var(--flags) would be re-parsed (megabytes) for every sprite.
await Promise.all(['flags', 'relIcons', 'msnIcons'].map(async k => {
  if (!BINARY[k]) return;
  D[k].uri = URL.createObjectURL(await (await fetch(BINARY[k])).blob());
  document.documentElement.style.setProperty('--' + k, `url(${D[k].uri})`);
}));
const flag = (t, size) => sprite('flags', D.flags.idx[t], size, 'flag') ||
  `<span class="flag" style="width:${size}px;height:${size}px;background:${css(tagCol(t))}" aria-hidden="true"></span>`;
const relIcon = (r, size) => sprite('relIcons', D.relIcons.idx[r], size, 'ricon') || '';
const tagName = t => (D.tags[t] && D.tags[t].name) || t;

// ---------------------------------------------------------------- map data
const W = D.w, H = D.h, NP = D.owner.length;
const tagIndex = {}; Object.keys(D.tags).forEach((t, i) => tagIndex[t] = i);
const ownerIdx = new Int32Array(NP).map((_, p) => D.owner[p] ? tagIndex[D.owner[p]] ?? -2 : -1);
const bbox = D.bbox;  // per country [x0, y0, x1, y1], from the build
let selected = null, ready = false, mapImage = null, idCanvas = null;

// province id at a map pixel, read one pixel at a time for hover and click (no full copy of the map);
// the 2D copy of the id image it reads from is made on the first hover or click, not at load
const idAt = (x, y) => {
  if (!idCanvas) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    idCanvas = c.getContext('2d', { willReadFrequently: true }); idCanvas.drawImage(mapImage, 0, 0);
  }
  const p = idCanvas.getImageData(x, y, 1, 1).data; return (p[0] << 8) | p[1];
};

// the id image is decoded off the main thread, exactly (no colour conversion), then goes to the GPU
unpack(BINARY.img, 'image/webp')
  .then(b => createImageBitmap(b, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' }))
  .then(bmp => {
    mapImage = bmp;
    if (!gl) { $('hint').textContent = 'This map needs a browser with WebGL 2.'; return; }
    initGL(bmp); ready = true; paint(); reset(false);
  });

// per-province colours for the current mode, as RGBA rows for the province data textures (alpha = striped)
const PW = 256, PH = Math.ceil(NP / PW);
function provinceColors() {
  const { land, sea, waste, nohist } = theme();
  const col = new Uint8Array(PW * PH * 4), alt = new Uint8Array(PW * PH * 4);
  const set = (a, p, c) => { a[p * 4] = c[0]; a[p * 4 + 1] = c[1]; a[p * 4 + 2] = c[2]; };
  const cache = {};
  for (let p = 0; p < NP; p++) {
    const k = D.kind[p], t = D.owner[p];
    let c = land;
    if (k === 2) c = sea; else if (k === 3) c = waste; else if (k === 4) c = nohist;
    else if (mode === 'religion') { const r = D.religions[D.prel[p]]; c = r ? r.color : land; }
    else if (mode === 'culture') { const r = D.cultures[D.pcul[p]]; c = r ? r.color : land; }
    else if (t) {
      const st = mode === 'actum' ? actumState(t) : (ABT.has(t) ? 2 : 0);
      const e = cache[t] || (cache[t] = { full: tagCol(t), dim: grey(tagCol(t), land) });
      if (st === 2) c = e.full;
      else if (st === 1) { c = e.full; col[p * 4 + 3] = 255; set(alt, p, e.dim); }
      else c = e.dim;
    }
    set(col, p, c);
  }
  return { col, alt };
}

// theme colours, read from the CSS tokens once per theme
let themeCache = null;
const theme = () => themeCache || (themeCache = Object.fromEntries(
  ['bg', 'sea', 'land', 'waste', 'nohist', 'border', 'accent'].map(n => [n, tokenRGB('--' + n)])));
const unit = c => c.map(x => x / 255);

// ---------------------------------------------------------------- globe renderer (WebGL 2)
// Pass 1 (on repaint) draws the flat map with its borders into a texture; pass 2 (every frame) wraps that
// texture around a sphere. The map spans 360° of longitude and LAT_TOP..LAT_BOTTOM of latitude.
const LAT_TOP = 75, LAT_BOTTOM = -58, DEG = Math.PI / 180;
const cv = $('map'), wrap = $('mapwrap');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false });
let mapProg, globeProg, mapFbo, mapTex, idTex, colTex, altTex, infoTex, GW = W, GH = H;

const VS = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0, 1); }`;
const MAP_FS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D ids, col, alt, info; uniform ivec2 size; uniform int sel; uniform vec3 border, accent;
out vec4 o;
int idAt(ivec2 c) {

    bool edge = owner(pr) != ow || owner(pd) != ow, coast = water(pr) || water(pd);
    if (ow == sel && (edge || owner(idAt(c - ivec2(1, 0))) != ow || owner(idAt(c - ivec2(0, 1))) != ow)) r = accent;
    else if (edge && ow >= 2 || coast) r = mix(r, border, .6);

function paint() {  // pass 1: after a change of mode, selection, theme or tag lists

let raf = 0;
const draw = () => { if (!raf) raf = requestAnimationFrame(render); };

  if (!ready) { gl.clearColor(...unit(bg), 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
  const { p, u } = globeProg;

// ---------------------------------------------------------------- view: centre longitude/latitude and globe radius (CSS px)

}
const toLonLat = (x, y) => [((x + .5) / W - .5) * 2 * Math.PI, (LAT_TOP - (y + .5) / H * (LAT_TOP - LAT_BOTTOM)) * DEG];

// pointer: drag to rotate, pinch to zoom, click to select, right click to toggle a dedicated tree
const pts = new Map(); let moved = false, pinch = null;
wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .modes, .shields') || e.button === 2) return;
  cancelAnimationFrame(anim); wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false; wrap.classList.add('drag');
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
});

  const r = wrap.getBoundingClientRect();
  if (!pts.has(e.pointerId)) { if (!e.target.closest('.modes, .shields, .zoom')) hover(e.clientX - r.left, e.clientY - r.top); else $('hover').hidden = true; return; }

    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; moved = true; return; }

}

wrap.addEventListener('pointerleave', () => { $('hover').hidden = true; });
wrap.addEventListener('contextmenu', e => {
  if (e.target.closest('.modes, .shields, .zoom')) return;
  e.preventDefault();
  if (!hasMode('actum')) return;
  const t = tagAt(e); if (!t) return;
  if (mode !== 'actum') setMode('actum');
  DED.has(t) ? DED.delete(t) : DED.add(t); save(); paint(); refreshPanel();

wrap.addEventListener('wheel', e => { if (e.target.closest('.shields')) return; e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });

addEventListener('resize', resize);

function hover(x, y) {
  const h = $('hover'), p = pick(x, y);
  if (p <= 0 || D.kind[p] === 2) { h.hidden = true; return; }
  const t = D.owner[p];
  let extra = '';
  if (mode === 'religion' && D.prel[p]) extra = ' · ' + esc((D.religions[D.prel[p]] || {}).name || D.prel[p]);
  else if (mode === 'culture' && D.pcul[p]) extra = ' · ' + esc((D.cultures[D.pcul[p]] || {}).name || D.pcul[p]);
  else if (t && mode === 'actum') extra = ['', ' · additional content', ' · dedicated tree'][actumState(t)];
  else if (t && mode === 'ante-bellum' && ABT.has(t)) extra = ' · Ante Bellum tree';
  h.innerHTML = `${esc(D.pname[p] || '#' + p)}${t ? ` · <b>${esc(tagName(t))}</b> <span class="tagcode">${t}</span>` : ''}${extra}`;
  h.hidden = false;
  const r = wrap.getBoundingClientRect();
  h.style.left = Math.max(4, Math.min(x + 14, r.width - h.offsetWidth - 6)) + 'px';
  h.style.top = Math.max(4, Math.min(y + 14, r.height - h.offsetHeight - 6)) + 'px';

// ---------------------------------------------------------------- chrome: modes, legend, shields
function renderModes() {
  $('modes').innerHTML = MODES.map(m => `<button data-mode="${m.id}" aria-pressed="${m.id === mode}" title="${esc(m.label)} (${m.key})">${esc(m.label)}</button>`).join('');
  const L = {
    actum: '<span><i class="sw ded"></i>Dedicated mission tree</span><span><i class="sw add"></i>Additional content</span><span><i class="sw none"></i>None</span>',
    'ante-bellum': '<span><i class="sw ded"></i>Ante Bellum mission tree</span><span><i class="sw none"></i>None</span>',
    religion: '<span><i class="sw multi"></i>Province religion</span>',
    culture: '<span><i class="sw multi"></i>Province culture</span>',
  };
  $('legend').innerHTML = L[mode];
  $('hint').textContent = `Click: details · Wheel: zoom · Drag: rotate · R: reset · Esc: close · 1–${MODES.length}: map mode` + (mode === 'actum' ? ' · Right click: toggle dedicated tree' : '');
}
$('modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
function setMode(m) {

}
function renderShields() {
  const bar = $('shields'), x = bar.scrollLeft;  // re-rendering would reset the scroll position
  bar.innerHTML = D.favorites.filter(t => D.tags[t]).map(t =>
    `<button class="shield${t === selected ? ' on' : ''}" data-tag="${t}" title="${esc(tagName(t))}">${flag(t, 52)}<span class="nm">${esc(tagName(t))}</span></button>`).join('');
  bar.scrollLeft = x;
  const on = bar.querySelector('.on');  // bring a selected favourite into view
  if (on && (on.offsetLeft < bar.scrollLeft || on.offsetLeft + on.offsetWidth > bar.scrollLeft + bar.clientWidth))
    bar.scrollLeft = on.offsetLeft - (bar.clientWidth - on.offsetWidth) / 2;

// the mouse wheel scrolls the shield bar sideways
$('shields').addEventListener('wheel', e => {

}

  return `<details data-sec="${id}"${open ? ' open' : ''}><summary>${extraHead}<span>${esc(title)}</span><span class="cnt">${tags.length}</span></summary><div class="body">${

  const all = Object.keys(D.tags).filter(matches).sort(byName);

    const ded = [...DED].filter(matches).sort(byName);
    html = `<p class="grp">Dedicated mission trees</p><textarea id="ed" rows="3" spellcheck="false" aria-label="Tags with a dedicated mission tree">${[...DED].join(' ')}</textarea>
      <div class="tools"><button class="btn" id="apply">Apply</button><button class="btn" id="revert">Reset</button><span class="note">Right click a country to toggle it.</span></div>` +
      section('a-ded', 'Dedicated mission tree', ded, true) +
      section('a-add', 'Additional content', all.filter(t => !DED.has(t) && ADD.has(t)), true) +
      section('a-none', 'No mission tree', all.filter(t => !actumState(t)), false);
  } else if (mode === 'ante-bellum') {
    html = section('b-tree', 'Ante Bellum mission tree', all.filter(t => ABT.has(t)), true) +
      section('b-none', 'No mission tree', all.filter(t => !ABT.has(t)), false);
  } else if (mode === 'religion') {
    const groups = {};
    for (const t of all) { const r = D.tags[t].religion || ''; (groups[r] = groups[r] || []).push(t); }
    const rels = Object.keys(groups).sort((a, b) => {
      const A = D.religions[a], B = D.religions[b];
      if (!A || !B) return !A - !B;  // unknown religion last
      return A.gname.localeCompare(B.gname) || A.name.localeCompare(B.name);
    });
    let lastG = null;
    for (const r of rels) {
      const R = D.religions[r] || { name: r || 'Unknown', gname: 'Other' };
      if (R.gname !== lastG) { html += `<p class="grp">${esc(R.gname)}</p>`; lastG = R.gname; }
      html += section('r-' + r, R.name, groups[r], false, relIcon(r, 20));
    }

    const groups = {};

    const gs = Object.keys(groups).sort((a, b) => !a - !b || (D.cgroups[a] || a).localeCompare(D.cgroups[b] || b));
    for (const g of gs) {
      const sample = groups[g][0], col = (D.cultures[D.tags[sample].culture] || {}).color;
      html += section('c-' + g, D.cgroups[g] || g || 'Unknown', groups[g], false, col ? `<i class="sw" style="background:${css(col)};margin:0"></i>` : '');
    }
  }
  panel.innerHTML = html || '<p class="empty">No countries match.</p>';
  if (mode === 'actum') {
    $('apply').onclick = () => { DED = new Set(parseTags($('ed').value)); save(); paint(); renderList(); };
    $('revert').onclick = () => { DED = new Set(D.dedicated); try { localStorage.removeItem(KEY); } catch (e) {} paint(); renderList(); };
  }
}
panel.addEventListener('toggle', e => {
  const d = e.target, id = d.dataset && d.dataset.sec; if (!id) return;
  if (d.open && lazyRows[id]) { d.querySelector('.body').innerHTML = rows(lazyRows[id]); delete lazyRows[id]; }
  if (!$('q').value.trim()) openState[id] = d.open;
}, true);

// ---------------------------------------------------------------- side panel: country detail
const formState = {};  // chosen switchable tree per tag (ab.txt "A | B: files")
function select(t, focus = true) {
  selected = t; paint(); renderShields();
  $('back').hidden = !t;
  if (!t) { hideTip(); return renderList(); }
  if (focus) focusTag(t);
  renderDetail();
}
function refreshPanel() { selected ? renderDetail() : renderList(); }
function renderDetail() {
  const t = selected, x = D.tags[t] || {};
  const cul = D.cultures[x.culture] || {}, rel = D.religions[x.religion] || {};
  const st = actumState(t);
  const status = mode === 'actum' ? (st === 2 ? '<span class="chip d">Dedicated mission tree</span>' : st === 1 ? '<span class="chip d">Additional content</span>' : '')
    : mode === 'ante-bellum' && ABT.has(t) ? '<span class="chip d">Ante Bellum mission tree</span>' : '';
  const useAB = mode === 'ante-bellum';
  const forms = useAB && x.abForms, form = forms ? Math.min(formState[t] || 0, forms.length - 1) : 0;
  const list = (forms ? forms[form].ab : useAB ? x.ab : x.aba) || [];
  const showTree = mode === 'actum' || mode === 'ante-bellum';
  const sec = (id, title, cnt, body) => `<details data-sec="${id}"${openState[id] ?? true ? ' open' : ''}><summary><span>${title}</span><span class="cnt">${cnt}</span></summary><div class="body">${body}</div></details>`;
  let extra;
  if (mode === 'religion') {
    extra = sec('religion', 'Religion', '', x.religion ? `
      <div class="dname" style="margin-bottom:6px">${relIcon(x.religion, 26)}<b>${esc(rel.name || x.religion)}</b>${rel.gname ? `<span class="tagcode">${esc(rel.gname)}</span>` : ''}</div>
      ${rel.desc ? `<p class="lore">${esc(rel.desc)}</p>` : '<p class="empty">No description in the game files.</p>'}` : '<p class="empty">No religion in the game files.</p>');
  } else if (mode === 'culture') {
    const g = cul.group, members = (g && D.groupCultures[g]) || [];
    extra = sec('culture', 'Culture group', members.length ? members.length + ' cultures' : '', g ? `
      <div class="dname" style="margin-bottom:6px"><b>${esc(D.cgroups[g] || g)}</b></div>
      <div class="chips">${members.map(c => `<span class="chip${c === x.culture ? ' d' : ''}">${esc((D.cultures[c] || {}).name || c)}</span>`).join('')}</div>` : '<p class="empty">No culture group in the game files.</p>');
  } else {
    extra = sec('tree', 'Mission tree', list.length ? list.reduce((n, i) => n + D.series[i].missions.length, 0) + ' missions' : '', `
      <p class="src">${useAB ? 'As in Ante Bellum' : `As in ${esc(D.title)}`}${list.length ? ' · hover a mission for details' : ''}</p>
      ${forms ? `<div class="tabs forms">${forms.map((f, k) => `<button data-form="${k}" aria-pressed="${k === form}">${f.tag ? flag(f.tag, 18) : ''}${esc(f.label)}</button>`).join('')}</div>` : ''}
      ${list.length ? `<div class="tree" id="tree"></div>` : '<p class="empty">No mission tree. This country uses the generic missions.</p>'}`);
  }
  panel.innerHTML = `
    <div class="dhead">${flag(t, 56)}<div style="min-width:0">
      <div class="dname"><h2>${esc(tagName(t))}</h2>${relIcon(x.religion, 26)}</div>
      <span class="tagcode">${t}</span></div></div>
    <div class="chips">${status}
      ${x.culture ? `<span class="chip">${esc(cul.name || x.culture)}</span>` : ''}
      ${x.religion ? `<span class="chip">${esc(rel.name || x.religion)}</span>` : ''}
      <span class="chip">${x.provs || 0} provinces</span><span class="chip">${fmt(x.dev || 0)} development</span></div>
    <details data-sec="lore"${openState.lore ?? true ? ' open' : ''} style="margin-top:12px"><summary><span>Lore</span></summary><div class="body">
      ${D.lore[x.lore] ? `<p class="lore">${esc(D.lore[x.lore])}</p>` : '<p class="empty">No lore text for this country in the game files.</p>'}</div></details>
    ${extra}`;
  panel.scrollTop = 0;
  panel.querySelectorAll('[data-form]').forEach(b => b.onclick = () => {
    const y = panel.scrollTop; formState[t] = +b.dataset.form; treeState = {}; renderDetail(); panel.scrollTop = y;
  });
  if (showTree && list.length) renderTree(list, (forms ? forms[form].mt : useAB ? x.mt : null) || {});
}

// mission tree: five slot columns; series in one slot that overlap become switchable branches
let treeState = {};
function treeLayout(list) {
  const slots = {};
  for (const i of list) { const s = D.series[i]; (slots[s.slot] = slots[s.slot] || []).push(i); }
  const out = {};
  for (const k of Object.keys(slots)) {
    const layers = [];
    for (const i of slots[k]) {
      const pos = new Set(D.series[i].missions.map(m => m.pos));
      let L = layers.find(l => !l.pos.some(p => pos.has(p)));
      if (!L) layers.push(L = { pos: [], series: [] });
      L.series.push(i); L.pos.push(...pos);
    }
    out[k] = layers;
  }
  return out;
}
// Laid out like EU4: one column per slot (at least 5, empty slots stay empty), one row per position,
// and arrows from each required mission to the missions that need it.
// mt: this country's own texts for missions whose titles/descriptions depend on the country
function renderTree(list, mt = {}) {
  const lay = treeLayout(list), slots = Object.keys(lay).map(Number).sort((a, b) => a - b);
  const pick = s => Math.min(treeState[s] || 0, lay[s].length - 1);
  const col = s => Math.max(1, s), cols = Math.max(5, ...slots.map(col));
  const hasTabs = slots.some(s => lay[s].length > 1), first = hasTabs ? 2 : 1;  // row of position 1
  let maxPos = 1;
  const cells = [], byId = {};
  for (const s of slots) for (const i of lay[s][pick(s)].series) for (let m of D.series[i].missions) {
    if (mt[m.id]) m = { ...m, title: mt[m.id][0], desc: mt[m.id][1] };
    byId[m.id] = m; maxPos = Math.max(maxPos, m.pos); cells.push({ m, col: col(s), row: m.pos + first - 1 });
  }
  const tabs = slots.filter(s => lay[s].length > 1).map(s => `<div class="tabs" style="grid-column:${col(s)};grid-row:1">${
    lay[s].map((l, k) => `<button data-slot="${s}" data-v="${k}" aria-pressed="${k === pick(s)}" title="${esc(l.series.map(i => D.series[i].name).join(', '))}">${String.fromCharCode(65 + k)}</button>`).join('')}</div>`).join('');
  const body = cells.map(({ m, col, row }) => {
    const ic = sprite('msnIcons', m.icon, 40, 'mi') || '<span class="mi"></span>';
    return `<div class="card" tabindex="0" data-m="${esc(m.id)}" data-c="${col}" data-r="${row}" style="grid-column:${col};grid-row:${row}">${ic}<span class="mt">${esc(m.title)}</span></div>`;
  }).join('');
  const el = $('tree');
  el.innerHTML = `<div class="tgrid" style="--cols:${cols};grid-template-rows:${hasTabs ? 'auto ' : ''}repeat(${maxPos}, auto)"><svg class="arrows" aria-hidden="true"></svg>${tabs}${body}</div>`;
  el._missions = byId;
  el.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { treeState[b.dataset.slot] = +b.dataset.v; renderTree(list, mt); });
  const grid = el.firstElementChild;
  drawArrows(grid);
  treeResize.disconnect(); treeResize.observe(grid);  // cards are 1fr wide: redraw when the panel resizes
}
const treeResize = new ResizeObserver(entries => entries.forEach(e => e.target.isConnected && drawArrows(e.target)));
// Arrows drawn like EU4's: each arrow leaves its mission's bottom edge and enters its target's top edge on
// the side it heads to / comes from (same column: the centre; farther ones further out), turns once in
// the middle of the gap below its source, and a requirement in the same column is one straight line.
// at: {id: {col, row}}; exit / entry are fractions of the card width.
function edgePoints(arrows, key) {
  const left = arrows.filter(a => a[key + 'Dir'] < 0).sort((p, q) => q.dist - p.dist);
  const right = arrows.filter(a => a[key + 'Dir'] > 0).sort((p, q) => p.dist - q.dist);
  left.forEach((a, i) => a[key] = .15 + .25 * (left.length < 2 ? .5 : i / (left.length - 1)));
  right.forEach((a, i) => a[key] = .6 + .25 * (right.length < 2 ? .5 : i / (right.length - 1)));
  arrows.filter(a => !a[key + 'Dir']).forEach(a => a[key] = .5);
}
function arrowRoutes(missions, at) {
  const arrows = [], outgoing = {}, incoming = {};
  for (const [id, m] of Object.entries(missions)) for (const r of m.req) {
    if (!at[id] || !at[r]) continue;
    const dc = at[id].col - at[r].col, a = { from: r, to: id, down: at[r].row < at[id].row, straight: !dc,
      exitDir: Math.sign(dc), entryDir: -Math.sign(dc), dist: Math.abs(dc) * 100 + Math.abs(at[id].row - at[r].row) };
    arrows.push(a); (outgoing[r] = outgoing[r] || []).push(a); (incoming[id] = incoming[id] || []).push(a);
  }
  Object.values(outgoing).forEach(l => edgePoints(l, 'exit'));
  Object.values(incoming).forEach(l => edgePoints(l, 'entry'));
  // an entry right below an unrelated exit of the card above would look like one line: move it outwards
  const above = {};
  for (const [id, p] of Object.entries(at)) above[p.col + ',' + p.row] = id;
  for (const a of arrows) {
    const u = above[at[a.to].col + ',' + (at[a.to].row - 1)];
    if (!u || u === a.from) continue;
    for (const o of outgoing[u] || []) if (o.to !== a.to && Math.abs(o.exit - a.entry) < .1)
      a.entry = a.entry < .5 ? Math.max(.08, o.exit - .12) : Math.min(.92, o.exit + .12);
  }
  return arrows;
}
function drawArrows(grid) {
  const svg = grid.querySelector('.arrows'), gap = parseFloat(getComputedStyle(grid).rowGap) || 24, cards = {}, at = {};
  for (const c of grid.querySelectorAll('.card')) {
    cards[c.dataset.m] = { left: c.offsetLeft, width: c.offsetWidth, top: c.offsetTop, bottom: c.offsetTop + c.offsetHeight };
    at[c.dataset.m] = { col: +c.dataset.c, row: +c.dataset.r };
  }
  let paths = '';
  for (const r of arrowRoutes(grid.parentElement._missions, at)) {
    const a = cards[r.from], b = cards[r.to], s = r.down ? 1 : -1;
    const y1 = r.down ? a.bottom : a.top, y2 = r.down ? b.top - 1 : b.bottom + 1, ex = b.left + b.width * r.entry;
    const sx = r.straight ? ex : a.left + a.width * r.exit;  // same column: one straight line
    let d = `M${sx} ${y1}`;
    if (Math.abs(ex - sx) < 1) d += `V${y2}`;
    else {  // down to the middle of the gap below the source, across, then down into the target; rounded corners
      const hy = y1 + s * gap / 2, dir = Math.sign(ex - sx), k = Math.min(3, Math.abs(ex - sx) / 2);
      d += `V${hy - s * k}Q${sx} ${hy} ${sx + dir * k} ${hy}H${ex - dir * k}Q${ex} ${hy} ${ex} ${hy + s * k}V${y2}`;
    }
    paths += `<path class="a" d="${d}" marker-end="url(#arrowhead)"/>`;
  }
  svg.setAttribute('width', grid.scrollWidth); svg.setAttribute('height', grid.scrollHeight);
  svg.innerHTML = `<defs><marker id="arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs>${paths}`;
}
const tip = $('tip');
function hideTip() { tip.hidden = true; document.querySelectorAll('.card.cur').forEach(c => c.classList.remove('cur')); }
function showTip(card) {
  const tree = $('tree'); if (!tree) return;
  const m = tree._missions[card.dataset.m]; if (!m) return;
  hideTip();
  card.classList.add('cur');
  const reqNames = m.req.map(r => tree._missions[r] ? tree._missions[r].title : r);
  tip.innerHTML = `<b>${esc(m.title)}</b>${esc(m.desc || '')}${reqNames.length ? `<div class="r">Requires: ${esc(reqNames.join(', '))}</div>` : ''}`;
  tip.hidden = false;
  const r = card.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left - tw - 8; if (left < 8) left = Math.min(innerWidth - tw - 8, r.right + 8);
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - th - 8, r.top)) + 'px';
}
panel.addEventListener('pointerover', e => { const c = e.target.closest('.card'); if (c) showTip(c); });
panel.addEventListener('pointerout', e => { const c = e.target.closest('.card'); if (c && !c.contains(e.relatedTarget)) hideTip(); });
panel.addEventListener('focusin', e => { const c = e.target.closest('.card'); if (c) showTip(c); });
panel.addEventListener('focusout', e => { if (e.target.closest('.card')) hideTip(); });
panel.addEventListener('scroll', hideTip);

panel.addEventListener('click', e => { if (e.target.closest('summary')) return; const r = e.target.closest('.row[data-tag]'); if (r) select(r.dataset.tag); });
panel.addEventListener('keydown', e => { const r = e.target.closest('.row[data-tag]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(r.dataset.tag); } });
$('q').addEventListener('input', () => { if (selected) { selected = null; $('back').hidden = true; paint(); renderShields(); } renderList(); });
$('back').onclick = () => select(null);

// ---------------------------------------------------------------- light/dark theme
// The choice is saved per viewer; without one the page follows the system setting.
const ICONS = {
  sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM19 12a7 7 0 0 0-2.5-5.4M15.5 15a4 4 0 0 0 0-6"/></svg>',
  muted: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></svg>',
};
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light')) === 'dark';
function renderThemeButton() {
  const b = $('theme'), label = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
  b.innerHTML = isDark() ? ICONS.sun : ICONS.moon; b.title = label; b.setAttribute('aria-label', label);
}
$('theme').onclick = () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('aba-mission-map-theme', t); } catch (e) {}
};
const retheme = () => { themeCache = null; renderThemeButton(); paint(); draw(); };  // re-tint the map
systemDark.addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
renderThemeButton();

// ---------------------------------------------------------------- music
// Browsers refuse to play sound before the viewer's first click or key press; then it starts on that.
// Unpacked in the background, so it doesn't hold up the map.
if (BINARY.music) unpack(BINARY.music.b64, BINARY.music.type).then(blob => {
  const KEY = 'aba-mission-map-music', audio = new Audio(URL.createObjectURL(blob)), btn = $('music');
  audio.loop = true; audio.volume = 0.5;
  let want = true;
  try { want = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  const render = () => {
    const label = audio.paused ? 'Play music' : 'Pause music';
    btn.innerHTML = audio.paused ? ICONS.muted : ICONS.play; btn.title = label; btn.setAttribute('aria-label', label);
  };
  const unlock = e => { if (e.target.closest && e.target.closest('#music')) return; stopWaiting(); if (want) audio.play().catch(() => {}); };
  const stopWaiting = () => { removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true); };
  audio.onplay = audio.onpause = render;
  btn.onclick = () => {
    stopWaiting(); want = audio.paused;
    want ? audio.play().catch(() => {}) : audio.pause();
    try { localStorage.setItem(KEY, want ? 'on' : 'off'); } catch (e) {}
  };
  if (want) audio.play().catch(() => { addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true); });
  btn.hidden = false; render();
});

const fromHash = () => { const h = location.hash.slice(1); if (hasMode(h)) setMode(h); };
addEventListener('hashchange', fromHash);
renderModes(); renderShields(); resize(); renderList(); fromHash();
</script>
